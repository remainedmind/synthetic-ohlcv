<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synthetic Klines Generator</title>
    <link rel="icon" href="data:," />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101010;
        --panel: #18181b;
        --panel-2: #222225;
        --border: #3f3f46;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #0d9488;
        --red: #dc2626;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        font: inherit;
        padding: 8px 9px;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        padding: 0;
      }

      input[type="range"] {
        padding: 0;
      }

      button {
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .page {
        width: min(1500px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 18px 0 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 24px;
        letter-spacing: 0;
      }

      .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(330px, 450px) 1fr;
        gap: 12px;
        align-items: start;
      }

      .panel,
      .control-group {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        padding: 12px;
      }

      .controls {
        display: grid;
        gap: 10px;
      }

      details.control-group {
        padding: 0;
      }

      details.control-group > summary {
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        list-style: none;
        padding: 12px;
      }

      details.control-group > summary::-webkit-details-marker {
        display: none;
      }

      .group-body {
        border-top: 1px solid var(--border);
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .field label,
      .toggle label {
        color: var(--muted);
        font-size: 12px;
      }

      .field-hint-wrap {
        position: relative;
      }

      .hint {
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        cursor: pointer;
        display: inline-grid;
        font-size: 11px;
        height: 20px;
        padding: 0;
        place-items: center;
        width: 20px;
      }

      .hint:hover,
      .hint:focus-visible,
      .hint[aria-expanded="true"] {
        border-color: var(--accent);
        color: var(--text);
      }

      .tooltip {
        background: #0f0f11;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        color: var(--text);
        font-size: 12px;
        line-height: 1.45;
        max-width: min(320px, calc(100vw - 48px));
        padding: 10px;
        position: absolute;
        right: 0;
        top: 26px;
        width: 280px;
        z-index: 20;
      }

      .tooltip[hidden] {
        display: none;
      }

      .slider-meta {
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        font-size: 11px;
      }

      .toggle-row {
        align-items: center;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .cycle-list {
        display: grid;
        gap: 8px;
      }

      .cycle {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #151518;
        padding: 8px;
      }

      .cycle-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .cycle-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .primary {
        background: var(--accent);
        border-color: var(--accent);
      }

      .danger {
        border-color: var(--red);
      }

      .charts {
        display: grid;
        gap: 10px;
      }

      .chart {
        min-height: 260px;
      }

      #priceChart {
        min-height: 560px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px;
      }

      .metric {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        padding: 10px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      .metric-value {
        margin-top: 4px;
        font-size: 18px;
        font-variant-numeric: tabular-nums;
      }

      .status {
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--muted);
        margin-top: 10px;
        padding: 10px;
        white-space: pre-wrap;
      }

      .error {
        border-color: var(--red);
        color: #fecaca;
      }

      @media (max-width: 1050px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        .topbar,
        .actions,
        .cycle-grid {
          align-items: stretch;
          grid-template-columns: 1fr;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <h1>Synthetic Klines Generator</h1>
          <p class="subtitle">Build learnable 15-minute OHLCV datasets with tunable trends.</p>
        </div>
        <div class="actions">
          <button id="previewButton" type="button" class="primary">Preview</button>
          <button id="saveButton" type="button">Save</button>
        </div>
      </header>

      <section class="layout">
        <aside>
          <form id="configForm" class="controls"></form>
          <div id="status" class="status">Loading defaults...</div>
        </aside>

        <section class="charts">
          <section id="metrics" class="metrics"></section>
          <section class="panel"><div id="priceChart" class="chart"></div></section>
          <section class="panel"><div id="volumeChart" class="chart"></div></section>
        </section>
      </section>
    </main>

    <script src="/assets/app.js"></script>
  </body>
</html>
